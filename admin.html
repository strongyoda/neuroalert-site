<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NeuroAlert 관리자</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="members.css">
<style>
  body{ background:#f3f6f9; }
  .adm-wrap{ max-width:1180px; margin:0 auto; padding:24px 18px 60px; }
  .adm-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .adm-top h1{ font-family:"Newsreader",serif; font-size:22px; color:#2F4F6F; }
  .adm-top a{ font-size:13px; color:#8a97a4; text-decoration:none; }
  .adm-card{ background:#fff; border:1px solid #e3e8ee; border-radius:12px; padding:26px; box-shadow:0 2px 10px rgba(20,30,45,.05); }
  /* 재인증 게이트 */
  .gate{ max-width:380px; margin:8vh auto; }
  .gate h2{ font-size:18px; color:#2F4F6F; margin-bottom:6px; }
  .gate p{ font-size:13px; color:#6b7784; line-height:1.6; margin-bottom:16px; }
  .gate input{ width:100%; padding:11px 12px; border:1px solid #d3dce4; border-radius:8px; font-size:14px; box-sizing:border-box; margin-bottom:10px; }
  .gate button{ width:100%; padding:11px; background:#b5384a; color:#fff; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; }
  .gate button:disabled{ opacity:.6; cursor:default; }
  .gate .msg{ font-size:13px; margin-top:10px; text-align:center; min-height:18px; }
  .gate .msg.err{ color:#b5384a; } .gate .msg.ok{ color:#2c7a3f; }
  .gate .who{ font-size:12px; color:#9aa7b3; margin-top:14px; text-align:center; }
  /* 표 */
  .adm-tools{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .adm-tools input{ flex:1; min-width:200px; padding:9px 12px; border:1px solid #d3dce4; border-radius:8px; font-size:13px; }
  .adm-count{ font-size:12.5px; color:#8a97a4; }
  .adm-expiry{ font-size:12px; color:#c08; margin-left:auto; }
  table.adm{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.adm th, table.adm td{ padding:8px 9px; border-bottom:1px solid #eef2f6; text-align:left; vertical-align:middle; }
  table.adm th{ font-size:11px; letter-spacing:.4px; color:#8a94a0; text-transform:uppercase; font-weight:600; background:#fafbfc; position:sticky; top:0; }
  table.adm tr:hover td{ background:#f8fafc; }
  .badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:11px; white-space:nowrap; }
  .badge.role-admin{ background:#fce4e8; color:#b5384a; border:1px solid #f2c7d0; }
  .badge.role-company{ background:#e8eef7; color:#2F4F6F; border:1px solid #c6d4e8; }
  .badge.role-member{ background:#f0f0f0; color:#777; border:1px solid #ddd; }
  .badge.st-active{ background:#e4f3e7; color:#2c7a3f; border:1px solid #bfe3c8; }
  .badge.st-suspended{ background:#fdecec; color:#c0392b; border:1px solid #f3c4c4; }
  .badge.vf{ background:#eef7ee; color:#2c7a3f; border:1px solid #cfe6cf; }
  .rowbtns{ display:flex; gap:5px; flex-wrap:wrap; }
  .rowbtns button{ font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid #d3dce4; background:#fff; color:#2b3947; cursor:pointer; white-space:nowrap; }
  .rowbtns button:hover{ background:#f0f4f8; }
  .rowbtns button.company{ border-color:#2F4F6F; color:#2F4F6F; font-weight:600; }
  .rowbtns button.suspend{ border-color:#c0392b; color:#c0392b; }
  .rowbtns button.self{ opacity:.4; cursor:default; }
  .muted{ color:#9aa7b3; }
</style>
</head>
<body>
<script src="config.js"></script>
<div class="adm-wrap">
  <div class="adm-top">
    <h1>NeuroAlert 관리자</h1>
    <a href="index.html">← 대시보드로</a>
  </div>

  <!-- 1단계: 재인증 게이트 -->
  <div id="gate" class="adm-card gate">
    <h2>관리자 재인증</h2>
    <p>보안을 위해 관리자 도구는 비밀번호를 한 번 더 확인합니다. 이 인증은 15분간 유효합니다.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
    <button id="go">확인</button>
    <div class="msg" id="gmsg"></div>
    <div class="who" id="who"></div>
  </div>

  <!-- 2단계: 회원 관리 -->
  <div id="panel" class="adm-card" hidden>
    <div class="adm-tools">
      <input type="search" id="q" placeholder="이메일·이름·소속 검색…">
      <span class="adm-count" id="count"></span>
      <span class="adm-expiry" id="expiry"></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="adm">
        <thead><tr>
          <th>이메일</th><th>표시명</th><th>소속(비공개)</th>
          <th>등급</th><th>상태</th><th>인증</th><th>가입일</th><th>관리</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const TOKEN_KEY = "neuroalert_token";
const ADMKEY = "neuroalert_admin_token"; // sessionStorage (탭 닫으면 소멸)
let MEMBERS = [], MY_ID = null, EXP_TIMER = null;

function loginToken(){ try{return localStorage.getItem(TOKEN_KEY);}catch(e){return null;} }
function admToken(){ try{return sessionStorage.getItem(ADMKEY);}catch(e){return null;} }
function setAdmToken(t){ try{ t?sessionStorage.setItem(ADMKEY,t):sessionStorage.removeItem(ADMKEY); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function gmsg(t,err){ const e=document.getElementById("gmsg"); e.textContent=t; e.className="msg "+(err?"err":"ok"); }

// 진입: 로그인/관리자 여부 먼저 확인
async function init(){
  const t = loginToken();
  if(!t){ gateBlock("로그인이 필요합니다. 대시보드에서 관리자 계정으로 로그인하세요."); return; }
  try{
    const r = await fetch(`${API_BASE}/api/auth/me`, {headers:{Authorization:"Bearer "+t}});
    if(!r.ok){ gateBlock("세션이 만료되었습니다. 다시 로그인하세요."); return; }
    const me = await r.json();
    MY_ID = me.id;
    if(me.role !== "admin"){ gateBlock("관리자 권한이 없는 계정입니다."); return; }
    document.getElementById("who").textContent = `${me.display_name || ""} (관리자)로 로그인됨`;
    // 이미 유효한 admin 토큰이 있으면 바로 패널
    if(admToken()){ showPanel(); }
  }catch(e){ gateBlock("서버에 연결할 수 없습니다."); }
}
function gateBlock(msg){
  document.getElementById("pw").disabled = true;
  document.getElementById("go").disabled = true;
  gmsg(msg, true);
}

document.getElementById("go").onclick = doReauth;
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doReauth(); });

async function doReauth(){
  const pw = document.getElementById("pw").value;
  if(!pw){ gmsg("비밀번호를 입력하세요.", true); return; }
  const btn = document.getElementById("go"); btn.disabled = true;
  try{
    const r = await fetch(`${API_BASE}/api/admin/reauth`, {
      method:"POST", headers:{"Content-Type":"application/json", Authorization:"Bearer "+loginToken()},
      body: JSON.stringify({password: pw})
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ gmsg(d.detail || "인증 실패", true); btn.disabled=false; return; }
    setAdmToken(d.admin_token);
    document.getElementById("pw").value = "";
    startExpiry(d.expires_in || 900);
    showPanel();
  }catch(e){ gmsg("연결 실패", true); }
  btn.disabled = false;
}

function admHeaders(){ return {"Content-Type":"application/json", Authorization:"Bearer "+admToken()}; }

async function showPanel(){
  document.getElementById("gate").hidden = true;
  document.getElementById("panel").hidden = false;
  await loadMembers();
}

async function loadMembers(){
  try{
    const r = await fetch(`${API_BASE}/api/admin/members`, {headers:admHeaders()});
    if(r.status === 403){ expireToPanel(); return; }
    const d = await r.json();
    MEMBERS = d.members || [];
    render();
  }catch(e){ alert("목록을 불러오지 못했습니다."); }
}

// admin 토큰 만료 → 게이트로 복귀
function expireToPanel(){
  setAdmToken(null);
  if(EXP_TIMER) clearInterval(EXP_TIMER);
  document.getElementById("panel").hidden = true;
  document.getElementById("gate").hidden = false;
  document.getElementById("pw").disabled = false;
  document.getElementById("go").disabled = false;
  gmsg("인증이 만료되었습니다. 비밀번호를 다시 입력하세요.", true);
}

function startExpiry(sec){
  if(EXP_TIMER) clearInterval(EXP_TIMER);
  let left = sec;
  const el = document.getElementById("expiry");
  const tick = ()=>{
    if(left <= 0){ expireToPanel(); return; }
    const m = Math.floor(left/60), s = left%60;
    el.textContent = `인증 만료까지 ${m}:${String(s).padStart(2,"0")}`;
    left--;
  };
  tick(); EXP_TIMER = setInterval(tick, 1000);
}

document.getElementById("q").addEventListener("input", render);

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = MEMBERS.filter(m=>{
    if(!q) return true;
    return [m.email,m.display_name,m.org_company,m.region,m.org_type,m.position]
      .some(v => String(v||"").toLowerCase().includes(q));
  });
  document.getElementById("count").textContent = `${list.length} / ${MEMBERS.length}명`;
  const rows = list.map(m=>{
    const self = (m.id === MY_ID);
    const roleBadge = `<span class="badge role-${esc(m.role)}">${esc(m.role)}</span>`;
    const stBadge = `<span class="badge st-${esc(m.status)}">${esc(m.status)}</span>`;
    const vf = m.verified ? `<span class="badge vf">기관</span>` : `<span class="muted">—</span>`;
    // 관리 버튼: 등급 전환 + 정지/활성 + 인증 토글. 본인은 강등/정지 비활성.
    let btns = "";
    if(m.role === "company") btns += `<button class="company" onclick="setCompanyMatch(${m.id})">🔔 알림키워드</button>`;
    if(m.role !== "company") btns += `<button class="company" onclick="setRole(${m.id},'company')">업체 지정</button>`;
    if(m.role !== "member")  btns += `<button onclick="setRole(${m.id},'member')">일반</button>`;
    if(m.role !== "admin")   btns += `<button onclick="setRole(${m.id},'admin')">관리자</button>`;
    if(m.status === "active") btns += `<button class="${self?'self':'suspend'}" ${self?'disabled':''} onclick="setStatus(${m.id},'suspended')">정지</button>`;
    else                      btns += `<button onclick="setStatus(${m.id},'active')">활성화</button>`;
    btns += `<button onclick="setVerified(${m.id},${m.verified?0:1})">${m.verified?'인증해제':'기관인증'}</button>`;
    return `<tr>
      <td>${esc(m.email)}</td>
      <td>${esc(m.display_name)}</td>
      <td>${esc(m.org_company) || '<span class="muted">—</span>'}${
        m.role==="company" && m.company_match
          ? `<div class="muted" style="font-size:11px;margin-top:2px;">🔔 ${esc(m.company_match)}</div>` : ""
      }</td>
      <td>${roleBadge}</td>
      <td>${stBadge}</td>
      <td>${vf}</td>
      <td class="muted">${esc((m.created_at||"").slice(0,10))}</td>
      <td><div class="rowbtns">${btns}</div></td>
    </tr>`;
  }).join("");
  document.getElementById("rows").innerHTML = rows || `<tr><td colspan="8" class="muted" style="padding:20px;text-align:center;">해당하는 회원이 없습니다.</td></tr>`;
}

async function update(payload, label){
  try{
    const r = await fetch(`${API_BASE}/api/admin/update_member`, {
      method:"POST", headers:admHeaders(), body: JSON.stringify(payload)
    });
    if(r.status === 403){ expireToPanel(); return; }
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ alert(d.detail || (label+" 실패")); return; }
    await loadMembers();
  }catch(e){ alert("연결 실패"); }
}
function setRole(id, role){
  const m = MEMBERS.find(x=>x.id===id);
  const msg = role==="company" ? "이 회원을 업체 공식 계정(company)으로 지정할까요?" :
              role==="admin"   ? "이 회원에게 관리자 권한을 부여할까요?" :
                                 "이 회원을 일반 등급으로 변경할까요?";
  if(!confirm(`${m?m.email:""}\n\n${msg}`)) return;
  update({member_id:id, role}, "등급 변경");
}
function setStatus(id, status){
  const m = MEMBERS.find(x=>x.id===id);
  if(status==="suspended" && !confirm(`${m?m.email:""}\n\n이 계정을 정지할까요? (로그인·댓글 차단)`)) return;
  update({member_id:id, status}, "상태 변경");
}
function setVerified(id, verified){
  update({member_id:id, verified}, "인증 변경");
}
function setCompanyMatch(id){
  const m = MEMBERS.find(x=>x.id===id);
  const cur = (m && m.company_match) || "";
  const v = prompt(
    `${m?m.email:""}\n\n이 업체 계정에 리콜 알림을 보낼 제조사 매칭 키워드를 쉼표로 입력하세요.\n`+
    `리콜의 제조사명·기기명에 이 키워드가 포함되면 이 계정으로 이메일이 발송됩니다.\n`+
    `예) stryker, trevo, synchro   (비우면 알림 해제)`, cur);
  if(v === null) return;
  update({member_id:id, company_match:v}, "알림 키워드");
}

init();
</script>
</body>
</html>
